<rect class="box" x="600" y="452" width="300" height="72" rx="8"/>
<text class="l" x="614" y="479">λ health</text>
<text class="m" x="614" y="501">GET /health</text>
<text class="m" x="614" y="520">IAM: one SSM read</text>
<path class="ar" d="M512,337 C 556,337 556,488 596,488"/>
<rect class="box" x="960" y="106" width="210" height="92" rx="8"/>
<text class="l" x="974" y="133">S3 bucket</text>
<text class="m" x="974" y="155">private</text>
<text class="m" x="974" y="174">public access blocked</text>
<rect class="box" x="960" y="442" width="210" height="92" rx="8"/>
<text class="l" x="974" y="469">SSM parameter</text>
<text class="m" x="974" y="491">/secondbreath/</text>
<text class="m" x="974" y="510">lastAuditRun</text>
<path class="ar" d="M900,152 L956,152"/>
<path class="ar" d="M900,488 L956,488"/>
<path class="ar" d="M190,337 L258,337"/>
<text class="m" x="224" y="327" text-anchor="middle">today</text>
<path class="ard" d="M115,300 C 120,210 180,154 258,154"/>
<path class="ard" d="M512,140 C 620,70 900,60 1050,102"/>
<text class="m" x="690" y="62">when enabled: reads the bucket via origin access control</text>
<line class="g" x1="40" x2="1160" y1="536" y2="536"/>
<text class="m" x="40" y="558">Keeping it up and cheap</text>
<rect class="box" x="40" y="570" width="200" height="72" rx="8"/>
<text class="l" x="54" y="597">EventBridge</text>
<text class="m" x="54" y="619">rate(5 minutes)</text>
<path class="ar" d="M240,606 L286,606"/>
<rect class="box" x="290" y="570" width="250" height="72" rx="8"/>
<text class="l" x="304" y="597">λ uptime</text>
<text class="m" x="304" y="619">GETs / and /health</text>
<text class="m" x="304" y="638">IAM: no policy</text>
<path class="ard" d="M400,570 C 400,480 380,440 380,388"/>
<text class="m" x="410" y="470">over HTTPS, from outside</text>
<path class="ar" d="M540,606 L586,606"/>
<rect class="box" x="590" y="570" width="290" height="72" rx="8"/>
<text class="l" x="604" y="597">CloudWatch alarm</text>
<text class="m" x="604" y="619">2 failures in 10 min → SNS email</text>
<rect class="box" x="910" y="570" width="260" height="72" rx="8"/>
<text class="l" x="924" y="597">AWS Budget, $20/month</text>
<text class="m" x="924" y="619">actual or forecast → email</text>
<text class="m" x="40" y="668">Every log group keeps 7 days. Nothing runs between requests.</text>
</svg>
